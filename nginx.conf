server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 单页应用：任何未命中的路径都回 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 构建产物带内容 hash，可以长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 别让nginx 猜错误页类型，保持纯静态行为
  error_page 404 /index.html;
}
